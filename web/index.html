<body>

  <div id="root">
    <div class="min-h-screen bg-white" role="status" aria-label="Loading Dovail Stay">
      <div class="h-[82px] border-b border-gray-200 px-5">
        <div class="mx-auto flex h-full max-w-[1500px] items-center justify-between">
          <div class="h-9 w-28 animate-pulse rounded-lg bg-gray-100"></div>
          <div class="h-11 w-20 animate-pulse rounded-full bg-gray-100"></div>
        </div>
      </div>
      <div class="border-b border-gray-200 px-4 py-3 md:hidden">
        <div class="h-16 animate-pulse rounded-full bg-gray-100"></div>
      </div>
      <main class="mx-auto max-w-7xl px-4 py-10 md:px-8">
        <div class="mb-8">
          <div class="h-4 w-16 animate-pulse rounded bg-gray-100"></div>
          <div class="mt-3 h-9 w-48 animate-pulse rounded bg-gray-100"></div>
          <div class="mt-3 h-4 w-full max-w-md animate-pulse rounded bg-gray-100"></div>
        </div>
        <div class="grid grid-cols-2 gap-x-5 gap-y-8 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
          <div class="aspect-square animate-pulse rounded-2xl bg-gray-100"></div>
          <div class="aspect-square animate-pulse rounded-2xl bg-gray-100"></div>
        </div>
      </main>
      <span class="sr-only">Loading…</span>
    </div>
